<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NFL Scoreboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* 1rem = 16px at 1920x1080; scales with the screen */
html { font-size: min(0.8333vw, 1.4815vh); }
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --navy: #0a0a2e; --black: #000; --blue: #2038ec; --lblue: #5c94fc;
  --green: #00a800; --dgreen: #005800; --yellow: #fce0a8; --gold: #f8b800;
  --white: #fcfcfc; --red: #e40058; --red2: #f83800; --grey: #7c7c7c;
}
html, body { height: 100%; background: var(--black); overflow: hidden; }
body {
  font-family: 'Press Start 2P', 'Courier New', monospace;
  color: var(--white); -webkit-font-smoothing: none; font-smooth: never;
  display: flex; flex-direction: column;
  background:
    repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 2px, transparent 2px 4px),
    var(--navy);
}
/* ---------- header ---------- */
header {
  flex: 0 0 auto; height: 8.5rem; margin: 1rem 1rem 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 2rem; background: var(--blue);
  border: 0.5rem solid var(--white);
  box-shadow: inset 0 0 0 0.5rem var(--black), 0 0 0 0.5rem var(--black);
}
.title { display: flex; align-items: center; gap: 1.6rem; }
.shield { width: 5.2rem; height: 5.2rem; image-rendering: pixelated; }
.title h1 { white-space: nowrap; font-size: 2.55rem; color: var(--yellow); text-shadow: 0.375rem 0.375rem 0 var(--black); letter-spacing: 0.1rem; font-weight: normal; }
.title h1 .wk { color: var(--white); }
.title h1 .blink { animation: blink 1.2s steps(1) infinite; color: var(--gold); }
@keyframes blink { 50% { opacity: 0; } }
.hright { text-align: right; line-height: 1.6; }
.clock { white-space: nowrap; font-size: 2.3rem; color: var(--white); text-shadow: 0.375rem 0.375rem 0 var(--black); }
.sub { white-space: nowrap; font-size: 1.15rem; color: var(--yellow); margin-top: 0.6rem; }
.sub .live { color: var(--red2); animation: blink 1s steps(1) infinite; }
.badge { display: inline-block; font-size: 1.2rem; padding: 0.4rem 0.6rem; margin-left: 0.8rem; border: 0.25rem solid currentColor; vertical-align: middle; }
.nosignal { color: var(--red2); animation: blink 0.8s steps(1) infinite; display: none; }
body.offline .nosignal { display: inline-block; }
.demo { color: var(--black); background: var(--gold); border-color: var(--gold); display: none; }
body.demo-mode .demo { display: inline-block; }
/* ---------- grid ---------- */
main { flex: 1 1 auto; min-height: 0; padding: 1.5rem 1rem 1rem; display: grid; gap: 1.25rem; }
.tile {
  position: relative; background: var(--black); min-height: 0; overflow: hidden;
  border: 0.5rem solid var(--white);
  box-shadow: inset 0 0 0 0.375rem var(--lblue);
  display: flex; flex-direction: column; padding: 0.875rem 1.25rem 0.75rem;
}
.tile.live { border-color: var(--gold); box-shadow: inset 0 0 0 0.375rem var(--green); }
.tile.final { border-color: var(--grey); box-shadow: inset 0 0 0 0.375rem #303030; }
.tile.redzone { animation: rz 0.7s steps(1) infinite; }
@keyframes rz { 0% { border-color: var(--red); box-shadow: inset 0 0 0 0.375rem var(--red2); } 50% { border-color: var(--gold); box-shadow: inset 0 0 0 0.375rem var(--red); } }
.status { display: flex; justify-content: space-between; align-items: center; font-size: calc(var(--fs) * 0.62); color: var(--lblue); white-space: nowrap; gap: 1rem; }
.tile.live .status .st { color: var(--gold); }
.tile.final .status .st { color: var(--grey); }
.status .net { color: var(--grey); overflow: hidden; flex: 0 1 auto; }
.status .st { flex: 0 0 auto; }
.tile .status .rzt { color: var(--red2); animation: blink 0.7s steps(1) infinite; }
.tile.live .status .net { color: var(--red2); }
.rows { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; padding: 0.3rem 0; }
.team { display: flex; align-items: center; gap: 0.6rem; flex: 1 1 0; min-height: 0; }
.logo { width: calc(var(--fs) * 1.45); height: calc(var(--fs) * 1.45); image-rendering: pixelated; image-rendering: crisp-edges; flex: 0 0 auto; }
.abbr { font-size: var(--fs); color: var(--white); width: calc(var(--fs) * 3.15); flex: 0 0 auto; text-shadow: 0.25rem 0.25rem 0 #202060; }
.rec { font-size: calc(var(--fs) * 0.45); color: var(--grey); flex: 1 1 auto; white-space: nowrap; }
.ball { width: calc(var(--fs) * 1.1); height: calc(var(--fs) * 0.66); image-rendering: pixelated; visibility: hidden; flex: 0 0 auto; }
.team.poss .ball { visibility: visible; }
.score { font-size: calc(var(--fs) * 1.25); color: var(--yellow); min-width: calc(var(--fs) * 2.6); flex: 0 0 auto; text-align: right; text-shadow: 0.25rem 0.25rem 0 #503000; }
.tile.pre .score { color: #2a2a48; text-shadow: none; }
.tile.pre .foot { color: var(--lblue); }
.tile.final .team.lose .abbr, .tile.final .team.lose .score { color: #5a5a5a; text-shadow: none; }
.tile.final .team.lose .logo { opacity: 0.4; filter: grayscale(0.7); }
.tile.final .team.win .score { color: var(--white); }
.tile.final .team.win .abbr::after { content: ''; }
.foot { font-size: calc(var(--fs) * 0.46); color: var(--green); white-space: nowrap; overflow: hidden; height: calc(var(--fs) * 0.7); line-height: 1; }
.tile.redzone .foot { color: var(--red2); }
.tile.final .foot { color: #505050; }
.banner {
  position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%);
  text-align: center; font-size: calc(var(--fs) * 0.9); padding: 1rem 0; white-space: nowrap;
  background: var(--red); color: var(--white); text-shadow: 0.375rem 0.375rem 0 var(--black);
  border-top: 0.5rem solid var(--gold); border-bottom: 0.5rem solid var(--gold);
  animation: bflash 0.4s steps(1) infinite; display: none; z-index: 3;
}
.banner.fg { background: var(--blue); }
.banner.sf { background: var(--green); }
.tile.scored .banner { display: block; }
@keyframes bflash { 50% { color: var(--gold); } }
.empty { grid-column: 1 / -1; align-self: center; text-align: center; font-size: 2.4rem; color: var(--yellow); line-height: 2; }
/* ---------- footer field ---------- */
footer {
  flex: 0 0 auto; height: 5.5rem; position: relative; overflow: hidden;
  border-top: 0.5rem solid var(--white); border-bottom: 0.5rem solid var(--white);
  background:
    repeating-linear-gradient(90deg, transparent 0 9.5rem, rgba(252,252,252,.85) 9.5rem 10rem),
    repeating-linear-gradient(90deg, var(--green) 0 5rem, #009000 5rem 10rem);
}
.ticker { position: absolute; top: 50%; transform: translateY(-50%); white-space: nowrap; font-size: 1.6rem; color: var(--white); text-shadow: 0.25rem 0.25rem 0 var(--black); background: rgba(0,0,0,.65); padding: 0.8rem 0; will-change: transform; left: 0; }

/* ---------- mobile (portrait, <=700px) ---------- */
@media (max-width: 700px) and (orientation: portrait) {
  html { font-size: 16px; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  html, body { height: auto; min-height: 100%; overflow-x: hidden; overflow-y: auto; }
  body { min-height: 100dvh; }

  header {
    height: auto; margin: 0.5rem 0.6rem 0; padding: 0.55rem 0.7rem;
    flex-wrap: wrap; align-items: center; gap: 0.35rem 0.7rem;
    position: sticky; top: 0; z-index: 10;
  }
  .title { gap: 0.55rem; min-width: 0; flex: 1 1 auto; }
  .shield { width: 2rem; height: 2rem; }
  .title h1 {
    white-space: normal; font-size: 0.78rem; line-height: 1.35;
    text-shadow: 2px 2px 0 var(--black); letter-spacing: 0;
  }
  .hright { text-align: left; flex: 1 1 100%; line-height: 1.45; }
  .clock { font-size: 0.72rem; text-shadow: 2px 2px 0 var(--black); }
  .sub { font-size: 0.55rem; margin-top: 0.25rem; white-space: normal; }
  .badge { font-size: 0.55rem; padding: 0.15rem 0.25rem; margin-left: 0.35rem; border-width: 2px; }

  /* 1 column of compact wide cards; right pad clears the BrewPage badge */
  #grid {
    display: grid !important;
    grid-template-columns: 1fr !important;
    grid-template-rows: none !important;
    grid-auto-rows: auto;
    align-content: start;
    gap: 0.55rem;
    padding: 0.6rem 2.6rem 0.6rem 0.6rem;
    flex: 0 0 auto; height: auto; min-height: 0;
  }
  .tile {
    height: auto; min-height: 0; overflow: hidden;
    padding: 0.5rem 0.65rem 0.45rem;
    border-width: 3px;
    box-shadow: inset 0 0 0 2px var(--lblue);
  }
  .tile.live { box-shadow: inset 0 0 0 2px var(--green); }
  .tile.final { box-shadow: inset 0 0 0 2px #303030; }

  .status { font-size: 0.62rem; gap: 0.45rem; }
  .rows { flex: 0 0 auto; min-height: 0; padding: 0.28rem 0; gap: 0.2rem; }
  .team { flex: 0 0 auto; min-height: 1.7rem; gap: 0.45rem; }
  .logo { width: 1.55rem; height: 1.55rem; }
  .abbr { font-size: 0.95rem; width: 3.15rem; text-shadow: 2px 2px 0 #202060; }
  .rec { font-size: 0.62rem; }
  .ball { width: 1.1rem; height: 0.66rem; }
  .score { font-size: 1.15rem; min-width: 2.4rem; text-shadow: 2px 2px 0 #503000; }
  .foot { font-size: 0.62rem; height: auto; min-height: 0.8rem; line-height: 1.35; overflow: hidden; }
  .banner { font-size: 0.7rem; padding: 0.45rem 0; border-width: 3px; text-shadow: 2px 2px 0 var(--black); }
  .empty { font-size: 0.9rem; line-height: 1.6; }

  footer {
    height: 2.55rem;
    position: sticky; bottom: 0; z-index: 10;
    border-top-width: 3px; border-bottom-width: 3px;
    background:
      repeating-linear-gradient(90deg, transparent 0 2.4rem, rgba(252,252,252,.85) 2.4rem 2.55rem),
      repeating-linear-gradient(90deg, var(--green) 0 1.25rem, #009000 1.25rem 2.5rem);
  }
  .ticker { font-size: 0.58rem; padding: 0.35rem 0; text-shadow: 2px 2px 0 var(--black); }
}

@media (min-width: 560px) and (max-width: 700px) and (orientation: portrait) {
  #grid { grid-template-columns: 1fr 1fr !important; padding-right: 2.6rem; }
}
</style>
</head>
<body>
<header>
  <div class="title">
    <canvas class="shield" id="shield" width="16" height="16"></canvas>
    <h1>NFL <span class="wk" id="week">WEEK --</span> <span class="blink">SCOREBOARD</span></h1>
  </div>
  <div class="hright">
    <div class="clock"><span id="clock">--:--</span></div>
    <div class="sub"><span id="summary">LOADING...</span><span class="badge nosignal">NO SIGNAL</span><span class="badge demo">DEMO</span></div>
  </div>
</header>
<main id="grid"><div class="empty">LOADING<span class="blink">...</span></div></main>
<footer><div class="ticker" id="ticker">NFL SCOREBOARD &nbsp;*&nbsp; LOADING...</div></footer>

<script>
(function () {
  'use strict';
  var API = 'https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard';
  var TZ = 'America/Edmonton';
  var REFRESH_MS = 30000;
  var BANNER_MS = 9000;
  var params = new URLSearchParams(location.search);
  var DEMO = params.get('demo') === '1';
  if (DEMO) document.body.classList.add('demo-mode');

  var lastData = null;
  var prevScores = {};     // eventId -> {teamId: score}
  var banners = {};        // eventId -> {text, cls, until}
  var logoCache = {};      // url -> dataURL (pixelated small)
  var first = true;

  // ---------- pixel art helpers ----------
  function drawPixels(canvas, rows, pal) {
    var ctx = canvas.getContext('2d');
    for (var y = 0; y < rows.length; y++) for (var x = 0; x < rows[y].length; x++) {
      var c = pal[rows[y][x]]; if (!c) continue; ctx.fillStyle = c; ctx.fillRect(x, y, 1, 1);
    }
  }
  var BALL = ['....######....', '..##########..', '.###.#.#.#.###', '##############', '.###.#.#.#.###', '..##########..', '....######....'];
  var ballURL = (function () {
    var c = document.createElement('canvas'); c.width = 14; c.height = 7;
    drawPixels(c, BALL, { '#': '#a05000' });
    var ctx = c.getContext('2d'); ctx.fillStyle = '#fcfcfc';
    [[4,2],[6,2],[8,2],[4,4],[6,4],[8,4],[5,3],[7,3],[9,3]].forEach(function(p){ ctx.fillRect(p[0],p[1],1,1); });
    return c.toDataURL();
  })();
  drawPixels(document.getElementById('shield'), [
    '################', '#WWWWWWWWWWWWWW#', '#WBBBBBBBBBBBBW#', '#WBWWBBBBBBWWBW#', '#WBBBBBBBBBBBBW#', '#WRRRRRRRRRRRRW#',
    '#WWRWRWWWWRWRWW#', '#WRRWRRRRRRWRRW#', '#WWRWRWWWWRWRWW#', '#WRRRRRRRRRRRRW#', '.#WRRRRRRRRRRW#.', '.#WWRRRRRRRRWW#.',
    '..#WWRRRRRRWW#..', '...##WWWWWW##...', '.....######.....', '................'
  ], { '#': '#000', W: '#fcfcfc', B: '#2038ec', R: '#e40058' });

  // Downscale a logo to 28px so it looks 8-bit when scaled back up with pixelated rendering
  function pixelLogo(url, img) {
    if (!url) return;
    if (logoCache[url]) { img.src = logoCache[url]; return; }
    var src = new Image(); src.crossOrigin = 'anonymous';
    src.onload = function () {
      try {
        var n = 28, c = document.createElement('canvas'); c.width = n; c.height = n;
        var ctx = c.getContext('2d'); ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(src, 0, 0, n, n);
        // posterize a bit for a limited-palette look; hard alpha edge
        var d = ctx.getImageData(0, 0, n, n), p = d.data;
        for (var i = 0; i < p.length; i += 4) {
          p[i] = Math.round(p[i] / 51) * 51; p[i+1] = Math.round(p[i+1] / 51) * 51; p[i+2] = Math.round(p[i+2] / 51) * 51;
          p[i+3] = p[i+3] > 110 ? 255 : 0;
        }
        ctx.putImageData(d, 0, 0);
        logoCache[url] = c.toDataURL();
      } catch (e) { logoCache[url] = url; }
      img.src = logoCache[url];
    };
    src.onerror = function () { img.style.visibility = 'hidden'; };
    src.src = url;
  }

  // ---------- time ----------
  // Fixed offset (Alberta = UTC-6 year-round). Avoids stale time-zone data on older Fire TV browsers. Override with ?utc=-7
  var UTC_OFF = parseFloat(params.get('utc') || '-6');
  function fmt(d, opts) { opts.timeZone = 'UTC'; return new Intl.DateTimeFormat('en-US', opts).format(new Date(d.getTime() + UTC_OFF * 3600e3)); }
  function tickClock() {
    var now = new Date();
    document.getElementById('clock').textContent = fmt(now, { weekday: 'short', hour: 'numeric', minute: '2-digit' }).toUpperCase().replace(',', '') + ' MT';
  }
  function kickoff(iso) {
    var d = new Date(iso);
    return fmt(d, { weekday: 'short' }).toUpperCase() + ' ' + fmt(d, { hour: 'numeric', minute: '2-digit' }).toUpperCase();
  }

  // ---------- data ----------
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function ordinal(n) { return ['', '1ST', '2ND', '3RD', '4TH'][n] || (n + 'TH'); }

  function parseGame(ev) {
    var comp = ev.competitions[0], st = ev.status || comp.status, type = st.type || {};
    var sit = comp.situation || {};
    var teams = {};
    comp.competitors.forEach(function (c) {
      var rec = (c.records || []).filter(function (r) { return r.type === 'total' || r.name === 'overall'; })[0];
      teams[c.homeAway] = {
        id: c.team.id, abbr: c.team.abbreviation, score: parseInt(c.score, 10) || 0,
        logo: c.team.logo || ('https://a.espncdn.com/i/teamlogos/nfl/500/' + String(c.team.abbreviation).toLowerCase() + '.png'),
        rec: rec ? rec.summary : '', winner: !!c.winner
      };
    });
    var state = type.state; // pre | in | post
    var label, foot = '';
    if (state === 'pre') {
      label = (type.name === 'STATUS_SCHEDULED') ? kickoff(ev.date) : String(type.shortDetail || '').toUpperCase();
    } else if (state === 'in') {
      if (type.name === 'STATUS_HALFTIME') label = 'HALFTIME';
      else if (type.name === 'STATUS_END_PERIOD') label = 'END ' + (st.period > 4 ? 'OT' : ordinal(st.period));
      else label = (st.period > 4 ? 'OT' : 'Q' + st.period) + ' ' + st.displayClock;
      if (sit.shortDownDistanceText) foot = sit.shortDownDistanceText + (sit.possessionText ? ' @ ' + sit.possessionText : '');
      else if (sit.downDistanceText) foot = sit.downDistanceText.replace(' at ', ' @ ');
    } else {
      label = (st.period > 4 ? 'FINAL/OT' : 'FINAL');
      if (/postponed|canceled|cancelled/i.test(type.description || '')) label = String(type.description).toUpperCase();
    }
    var net = '';
    if (comp.broadcasts && comp.broadcasts[0] && comp.broadcasts[0].names) net = comp.broadcasts[0].names[0];
    else if (comp.broadcast) net = comp.broadcast;
    if (state === 'pre') {
      var mins = Math.round((new Date(ev.date) - Date.now()) / 60000);
      if (mins > 0 && mins <= 180) foot = 'KICKOFF IN ' + (mins >= 60 ? Math.floor(mins / 60) + 'H ' : '') + (mins % 60) + 'M';
    }
    net = String(net).toUpperCase().replace('PRIME VIDEO', 'PRIME').replace('NFL NETWORK', 'NFLN').replace('NETFLIX','NETFLX');
    if (net.length > 6) net = net.slice(0, 6);
    var last = sit.lastPlay && sit.lastPlay.text ? sit.lastPlay.text : '';
    return {
      id: ev.id, date: ev.date, state: state, label: label, net: String(net).toUpperCase(),
      away: teams.away, home: teams.home, poss: sit.possession || null,
      redzone: !!sit.isRedZone && state === 'in', foot: String(foot).toUpperCase(), last: last
    };
  }

  function sortGames(games) {
    var rank = { 'in': 0, 'pre': 1, 'post': 2 };
    return games.sort(function (a, b) {
      var r = (rank[a.state] - rank[b.state]); if (r) return r;
      var t = new Date(a.date) - new Date(b.date);
      return a.state === 'post' ? -t : t;
    });
  }

  function detectScoring(games) {
    var now = Date.now();
    games.forEach(function (g) {
      var p = prevScores[g.id];
      if (p && !first) {
        ['away', 'home'].forEach(function (s) {
          var t = g[s], delta = t.score - (p[t.id] || 0);
          if (delta <= 0) return;
          var text, cls = '';
          if (delta >= 6) text = 'TOUCHDOWN!';
          else if (delta === 3) { text = 'FIELD GOAL!'; cls = 'fg'; }
          else if (delta === 2) { text = 'SAFETY!'; cls = 'sf'; }
          else if (delta === 1) { text = 'EXTRA POINT!'; cls = 'fg'; }
          else { text = 'SCORE!'; }
          banners[g.id] = { text: t.abbr + ' ' + text, cls: cls, until: now + BANNER_MS };
        });
      }
      prevScores[g.id] = {}; prevScores[g.id][g.away.id] = g.away.score; prevScores[g.id][g.home.id] = g.home.score;
    });
  }

  // ---------- render ----------
  var grid = document.getElementById('grid');
  function isMobileBoard() {
    return window.matchMedia && window.matchMedia('(max-width: 700px) and (orientation: portrait)').matches;
  }
  function layout(n) {
    if (isMobileBoard()) {
      // Let the mobile media query own the grid; clear kiosk inline sizes.
      grid.style.gridTemplateColumns = '';
      grid.style.gridTemplateRows = '';
      grid.style.removeProperty('--fs');
      return;
    }
    var cols = n <= 4 ? 2 : (n <= 9 ? 3 : (n <= 16 ? 4 : 5));
    if (n <= 2) cols = n || 1;
    var rows = Math.max(1, Math.ceil(n / cols));
    grid.style.gridTemplateColumns = 'repeat(' + cols + ', minmax(0, 1fr))';
    grid.style.gridTemplateRows = 'repeat(' + rows + ', minmax(0, 1fr))';
    // base font size for tile contents, shrinks with more rows/cols
    var fs = Math.min(2.6, 9 / rows, 8.8 / cols);
    grid.style.setProperty('--fs', fs.toFixed(2) + 'rem');
  }

  function teamRow(g, side) {
    var t = g[side], cls = 'team';
    if (g.poss && String(g.poss) === String(t.id)) cls += ' poss';
    if (g.state === 'post') {
      var other = g[side === 'away' ? 'home' : 'away'];
      if (t.score > other.score) cls += ' win'; else if (t.score < other.score) cls += ' lose';
    }
    return '<div class="' + cls + '">' +
      '<img class="logo" data-src="' + esc(t.logo) + '" alt="">' +
      '<span class="abbr">' + esc(t.abbr) + '</span>' +
      '<span class="rec">' + esc(t.rec) + '</span>' +
      '<img class="ball" src="' + ballURL + '" alt="">' +
      '<span class="score">' + (g.state === 'pre' ? '-' : t.score) + '</span></div>';
  }

  function render(data) {
    var games = sortGames((data.events || []).map(parseGame));
    detectScoring(games);
    first = false;
    var wk = data.week && data.week.number;
    var stype = data.season && data.season.type;
    var wkEl = document.getElementById('week');
    wkEl.textContent = stype === 3 ? 'PLAYOFFS' : (stype === 1 ? 'PRESEASON ' + (wk || '') : 'WEEK ' + (wk || '--'));

    var live = games.filter(function (g) { return g.state === 'in'; }).length;
    var fin = games.filter(function (g) { return g.state === 'post'; }).length;
    var pre = games.length - live - fin;
    document.getElementById('summary').innerHTML =
      (live ? '<span class="live">&#9679;</span> <span style="color:#f83800">' + live + ' LIVE</span> &nbsp;' : '') +
      pre + ' UPCOMING &nbsp;' + fin + ' FINAL';

    layout(games.length || 1);
    if (!games.length) { grid.innerHTML = '<div class="empty">NO GAMES THIS WEEK<br>SEE YOU NEXT SEASON!</div>'; }
    else {
      var now = Date.now();
      grid.innerHTML = games.map(function (g) {
        var cls = 'tile ' + ({ 'in': 'live', 'post': 'final', 'pre': 'pre' }[g.state] || 'pre') + (g.redzone ? ' redzone' : '');
        var b = banners[g.id];
        if (b && b.until > now) cls += ' scored'; else b = null;
        var foot = g.state === 'in' ? esc(g.foot) : esc(g.foot);
        return '<div class="' + cls + '">' +
          '<div class="status"><span class="st">' + esc(g.label) + '</span>' + (g.redzone ? '<span class="net rzt">RED ZONE</span>' : '<span class="net">' + esc(g.net) + '</span>') + '</div>' +
          '<div class="rows">' + teamRow(g, 'away') + teamRow(g, 'home') + '</div>' +
          '<div class="foot">' + foot + '</div>' +
          '<div class="banner ' + (b ? b.cls : '') + '">' + (b ? esc(b.text) : '') + '</div></div>';
      }).join('');
      Array.prototype.forEach.call(grid.querySelectorAll('img.logo'), function (img) { pixelLogo(img.getAttribute('data-src'), img); });
    }

    // ticker
    var bits = [];
    games.forEach(function (g) { if (g.state === 'in' && g.last) bits.push(g.away.abbr + '-' + g.home.abbr + ': ' + g.last.toUpperCase()); });
    games.forEach(function (g) { if (g.state === 'post') bits.push('FINAL ' + g.away.abbr + ' ' + g.away.score + '  ' + g.home.abbr + ' ' + g.home.score); });
    if (data.week && data.week.teamsOnBye && data.week.teamsOnBye.length)
      bits.push('BYE: ' + data.week.teamsOnBye.map(function (t) { return t.abbreviation; }).join(' '));
    bits.push('UPDATED ' + fmt(new Date(), { hour: 'numeric', minute: '2-digit' }).toUpperCase() + ' MT');
    setTicker(bits.join('   \u2605   '));
  }

  // ---------- ticker scroll (JS, steady speed) ----------
  var tk = document.getElementById('ticker'), tkX = null, tkLast = 0;
  function setTicker(text) { if (tk.textContent !== text) tk.textContent = text; }
  function tickerFrame(ts) {
    var w = tk.offsetWidth, W = window.innerWidth;
    if (tkX === null) tkX = W;
    var dt = tkLast ? Math.min(100, ts - tkLast) : 16; tkLast = ts;
    tkX -= dt * W / 9000; // ~9s to cross the screen
    if (tkX < -w) tkX = W;
    tk.style.transform = 'translate(' + Math.round(tkX / 4) * 4 + 'px, -50%)';
    requestAnimationFrame(tickerFrame);
  }
  requestAnimationFrame(tickerFrame);

  // ---------- demo mode (preview only) ----------
  function applyDemo(data) {
    var evs = data.events || [];
    var demoStates = [
      { period: 4, clock: '2:07', poss: 'home', rz: true, dd: '1st & Goal at OPP 4', score: [17, 20] },
      { period: 3, clock: '8:42', poss: 'away', rz: false, dd: '3rd & 7 at OWN 35', score: [10, 14], banner: 'away' },
      { period: 2, clock: '0:38', poss: 'away', rz: true, dd: '2nd & 6 at OPP 14', score: [3, 7] },
      { half: true, score: [13, 10] },
      { period: 1, clock: '11:15', poss: 'home', rz: false, dd: '1st & 10 at OWN 25', score: [0, 0] },
      { final: true, score: [27, 24] },
      { final: true, score: [10, 31], ot: false }
    ];
    var n = 0;
    evs.forEach(function (ev) {
      var ds = demoStates[n]; if (!ds) return;
      var comp = ev.competitions[0], st = ev.status;
      var away = comp.competitors.filter(function (c) { return c.homeAway === 'away'; })[0];
      var home = comp.competitors.filter(function (c) { return c.homeAway === 'home'; })[0];
      if (st.type.state === 'post') return;
      n++;
      away.score = String(ds.score[0]); home.score = String(ds.score[1]);
      if (ds.final) {
        st.period = 4; st.type = { name: 'STATUS_FINAL', state: 'post', completed: true, description: 'Final' };
        comp.situation = null; return;
      }
      if (ds.half) {
        st.period = 2; st.type = { name: 'STATUS_HALFTIME', state: 'in', description: 'Halftime' }; comp.situation = {}; return;
      }
      st.period = ds.period; st.displayClock = ds.clock;
      st.type = { name: 'STATUS_IN_PROGRESS', state: 'in', description: 'In Progress' };
      var opp = ds.poss === 'home' ? away : home, own = ds.poss === 'home' ? home : away;
      comp.situation = {
        possession: (ds.poss === 'home' ? home : away).team.id, isRedZone: ds.rz,
        shortDownDistanceText: ds.dd.split(' at ')[0],
        possessionText: ds.dd.split(' at ')[1].replace('OPP', opp.team.abbreviation).replace('OWN', own.team.abbreviation),
        lastPlay: { text: 'DEMO PLAY: ' + own.team.abbreviation + ' PASS COMPLETE FOR 12 YARDS' }
      };
      if (ds.banner) banners[ev.id] = { text: (ds.banner === 'home' ? home : away).team.abbreviation + ' TOUCHDOWN!', cls: '', until: Date.now() + 3600e3 };
    });
    return data;
  }

  // ---------- fetch loop ----------
  function load() {
    var url = API + (API.indexOf('?') < 0 ? '?' : '&') + '_=' + Date.now();
    var ctl = window.AbortController ? new AbortController() : null;
    var to = setTimeout(function () { if (ctl) ctl.abort(); }, 15000);
    fetch(url, ctl ? { signal: ctl.signal, cache: 'no-store' } : { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (data) {
        clearTimeout(to);
        if (DEMO) data = applyDemo(data);
        lastData = data; document.body.classList.remove('offline');
        render(data);
      })
      .catch(function (e) {
        clearTimeout(to);
        document.body.classList.add('offline');
        if (lastData) render(lastData);
        else grid.innerHTML = '<div class="empty">NO SIGNAL<br><span class="blink">RETRYING...</span></div>';
        if (window.console) console.warn('scoreboard fetch failed', e);
      });
  }

  window.SB = { pixelLogo: pixelLogo, esc: esc, fmt: fmt, ballURL: ballURL, params: params, getData: function () { return lastData; } };

  if (window.matchMedia) {
    var onBoardResize = function () { if (lastData) layout((lastData.events || []).length || 1); };
    var boardMQ = window.matchMedia('(max-width: 700px) and (orientation: portrait)');
    if (boardMQ.addEventListener) boardMQ.addEventListener('change', onBoardResize);
    else if (boardMQ.addListener) boardMQ.addListener(onBoardResize);
    window.addEventListener('resize', onBoardResize);
  }

  tickClock(); setInterval(tickClock, 1000);
  load(); setInterval(load, REFRESH_MS);
  // re-render every few seconds so score banners clear on time
  setInterval(function () { if (lastData) {
    var now = Date.now(), any = false;
    for (var k in banners) if (banners[k].until <= now) { delete banners[k]; any = true; }
    if (any) { first = true; render(lastData); }
  } }, 2000);
  // keep the screen awake where the browser allows it
  try { if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(function () {}); } catch (e) {}
  // reload the whole page every 6 hours to stay fresh in kiosk mode
  setTimeout(function () { location.reload(); }, 6 * 3600e3);
})();
</script>
